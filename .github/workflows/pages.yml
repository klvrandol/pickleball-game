name: Prepare or publish PICKLE COURT Pages

# Resolve the uploaded asset provenance in DEPLOYMENT.md before approving publish.
# Deliberately manual: pushing this workflow cannot publish or change Pages settings.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish publicly? Enable only after the owner approves the release.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pickle-court-pages
  cancel-in-progress: false

jobs:
  build:
    # After owner approval, merge the reviewed completed game into default branch main.
    # main currently holds an older prototype; no merge/push is performed during preparation.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tools/check-pages-assets.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement is intentionally not enabled: the owner configures Pages separately.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
